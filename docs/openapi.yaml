openapi: 3.0.3
info:
  title: LMS API
  description: API for the AI-Powered Corporate Learning Management System
  version: 1.0.0
  contact:
    email: api-support@example.com

servers:
  - url: https://your-domain.com/api
    description: Production server
  - url: http://localhost:8000/api
    description: Development server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Courses
    description: Course management
  - name: Enrollments
    description: Course enrollment operations
  - name: Lessons
    description: Lesson content and progress
  - name: Assessments
    description: Assessment and testing
  - name: Certificates
    description: Certificate management
  - name: Users
    description: User management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"
        errors:
          type: object

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [employee, instructor, hr_admin, super_admin]
        position:
          type: string
        avatar:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        difficulty_level:
          type: string
          enum: [beginner, intermediate, advanced]
        estimated_duration:
          type: integer
        thumbnail:
          type: string
          format: uri
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time


    Enrollment:
      type: object
      properties:
        id:
          type: integer
        course_id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum: [active, completed, dropped]
        progress_percentage:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    Certificate:
      type: object
      properties:
        id:
          type: integer
        certificate_number:
          type: string
        user_id:
          type: integer
        course_id:
          type: integer
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /register:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [employee, instructor, hr_admin]
                department_id:
                  type: integer
                position:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '422':
          description: Validation error


  /me:
    get:
      tags:
        - Authentication
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /courses:
    get:
      tags:
        - Courses
      summary: List courses
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: difficulty_level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  links:
                    type: object
                  meta:
                    type: object

  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Get course details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Course'
        '404':
          description: Course not found

  /enrollments:
    get:
      tags:
        - Enrollments
      summary: List user enrollments
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, dropped]
      responses:
        '200':
          description: List of enrollments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrollment'

  /courses/{id}/enroll:
    post:
      tags:
        - Enrollments
      summary: Enroll in course
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Successfully enrolled
        '400':
          description: Enrollment failed

  /certificates:
    get:
      tags:
        - Certificates
      summary: List user certificates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'

  /certificates/verify:
    post:
      tags:
        - Certificates
      summary: Verify certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - certificate_number
              properties:
                certificate_number:
                  type: string
      responses:
        '200':
          description: Certificate verification result
        '404':
          description: Certificate not found
